version: '3.8'

services:
  # 1. Визуальный конструктор (Low-code интерфейс)
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n_ui
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  # 2. Локальная нейросеть (Генеративная LLM для RCA)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_llm
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # 2.1. Авто-загрузчик модели (скачает qwen2.5 и отключится)
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama_init
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    # Ждем 5 секунд, пока поднимется сервер, и командуем загрузку
    entrypoint: sh -c "sleep 5 && ollama pull qwen2.5"

  # 3. Наш умный мост (FastAPI + DistilBERT)
  ai-bridge:
    build: 
      context: ./backend
    container_name: ai_bridge_api
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  n8n_data:
  ollama_data: